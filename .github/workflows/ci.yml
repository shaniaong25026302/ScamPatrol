# CI — the validation gate. Runs ONLY on pull requests, so every change is checked
# BEFORE it can be merged. Branch protection requires the job names below, which is
# what makes "only successful builds proceed" enforceable rather than a promise.
#
# Four jobs. The order is deliberate: cheapest and most serious first.
#   secret-scan    — is anyone committing a credential? Seconds, and it blocks.
#   lint-and-test  — style, the config contract, the schema, then the suite against a REAL MySQL.
#   docker-build   — builds the image AND boots it, because a built image is not a working image.
#   ci-summary     — one green tick for branch protection to require.
#
# Deliberately NOT triggered on push to main. CI guards the door; CD (cd.yml) runs
# once you are through it. Re-running these checks on the merge commit would repeat
# work that already passed on the pull request, for no extra information: nothing can
# reach main without passing here first. That clean split is also what lets CD trust
# its input and go straight to building.
#
# The job names are load-bearing: branch protection requires checks BY NAME, so
# renaming a job would silently stop it gating.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # lets us run it by hand from the Actions tab

# If several pushes land quickly, cancel the older runs. Saves minutes and means
# the tick on a PR always reflects the newest commit rather than a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this file may write to the repository. CI reads and
# reports. Only CD is allowed to publish anything.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. SECRET SCAN — the gate we did not have, and paid for.
  #
  # On 30 July 2026 a file named "..env" containing real database, JWT and API
  # credentials was committed to this PUBLIC repository. It got through because
  # .gitignore listed ".env", and "..env" is a different name. Every credential in
  # it had to be rotated.
  #
  # A rule that is written down is not a control. This job is the control: a pull
  # request containing a credential cannot be merged, whoever wrote it.
  #
  # What it does and does not catch, measured rather than assumed. Run against a file
  # holding five fake credentials, it flagged the API keys, the JWT secret and the
  # GitHub token, and MISSED a short database password, because the generic rule keys
  # off entropy and a memorable password does not have much. So this is not a complete
  # defence on its own, and it is not the only one: .gitignore stops the file by name,
  # this stops the contents by shape. The leak that prompted both would have been
  # caught by either.
  #
  # Why this blocks here rather than living in the security workflow: that workflow
  # runs alongside the gate and is deliberately non-blocking, so a slow scan can
  # never stall a merge. This one is the opposite. It has to block, so it lives
  # with the other things that block.
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit-range scan below needs history, not just a snapshot

      # Pinned to an exact version on purpose. A scanner that silently changes its
      # rules between runs is a gate you cannot reason about, and "it passed
      # yesterday" stops meaning anything.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan 1 — the files as they would land on main.
      #
      # --redact is not optional here. This repository is public, so its Actions logs
      # are public too. Without it a scanner that finds a secret PRINTS the secret,
      # and the tool meant to prevent the leak becomes the leak.
      - name: Scan the working tree for secrets
        run: gitleaks detect --source . --no-git --redact --verbose

      # Scan 2 — the commits this pull request adds.
      #
      # Scan 1 cannot see a secret that was committed and then deleted again later in
      # the same branch, but the value is still in the history and still published.
      # This scans ONLY this branch's own commits, so it is not poisoned by anything
      # already sitting in main's history.
      - name: Scan this pull request's own commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          gitleaks detect --source . --redact --verbose \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. LINT AND TEST — against a real database.
  #
  # The suite is written to SKIP its database-dependent tests when it cannot reach
  # MySQL. That is good test design and a bad CI result: with no database the job
  # goes green having asserted almost nothing. The service container below is what
  # turns those skips into real assertions.
  # ──────────────────────────────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    # A throwaway MySQL for the life of this job only. It is destroyed when the job
    # ends, so the tests can create, corrupt and delete whatever they like.
    services:
      mysql:
        image: mysql:8.0
        env:
          # Local to one ephemeral container nothing outside this job can reach. It is
          # deliberately obvious that it protects nothing, so nobody mistakes it for a
          # value worth keeping.
          MYSQL_ROOT_PASSWORD: ci-not-a-real-password
          MYSQL_DATABASE: scampatrol_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # AI_FAKE=1 makes the app answer every Gemini call from its own offline code.
      # So CI needs no API key at all, and burns none of the free-tier quota.
      AI_FAKE: "1"
      # jwt.js reads JWT_SECRET when the module loads, so it must exist before the tests
      # run. This value is fake and public on purpose: it never protects anything real.
      JWT_SECRET: ci-test-secret-not-real
      NODE_ENV: test
      # Point the app at the service container above.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-not-a-real-password
      DB_NAME: scampatrol_ci

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reuses the npm download cache between runs

      # `npm ci` (not `npm install`) installs the EXACT versions in package-lock.json
      # and fails if the lockfile is out of step. That is what makes the build repeatable.
      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      # ── The configuration contract gate ────────────────────────────────────
      # .env.example is what every teammate's container, compose file and Ansible
      # template is written against. When the app starts reading a new variable and
      # nobody adds it there, the app does not crash: it reads undefined and then
      # behaves oddly somewhere else entirely, on someone else's machine, where it
      # looks like their bug.
      #
      # So the contract is checked mechanically instead of remembered. Both directions
      # matter. Undocumented means a teammate cannot know to set it. Documented but
      # never read means the contract describes an app that no longer exists, which is
      # how you end up setting a variable that does nothing and trusting it.
      - name: Check .env.example still matches what the app reads
        run: |
          grep -rhoE 'process\.env\.[A-Z0-9_]+' src/ \
            | sed 's/process\.env\.//' | sort -u > /tmp/used.txt
          grep -oE '^[A-Z0-9_]+=' .env.example \
            | sed 's/=$//' | sort -u > /tmp/documented.txt

          UNDOCUMENTED=$(comm -23 /tmp/used.txt /tmp/documented.txt)
          UNREAD=$(comm -13 /tmp/used.txt /tmp/documented.txt)
          FAILED=0

          if [ -n "$UNDOCUMENTED" ]; then
            echo "Read by src/ but missing from .env.example:"
            echo "$UNDOCUMENTED" | sed 's/^/  /'
            echo "Add each one, with a comment saying what it is for and whether it is required."
            FAILED=1
          fi

          if [ -n "$UNREAD" ]; then
            echo "Documented in .env.example but nothing in src/ reads it:"
            echo "$UNREAD" | sed 's/^/  /'
            echo "Either the app stopped using it, or one of the two names is misspelt."
            FAILED=1
          fi

          [ "$FAILED" = "1" ] && exit 1
          echo "Contract holds: $(wc -l < /tmp/used.txt) variables, all documented and all read."

      # ── The schema gate ────────────────────────────────────────────────────
      # Wait properly rather than trusting the container's own health check alone. A
      # suite that fails because the database was not up yet is the most expensive kind
      # of flake, because it looks exactly like a real failure.
      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root \
                 -pci-not-a-real-password --silent 2>/dev/null; then
              echo "MySQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL never accepted a connection."
          exit 1

      - name: Apply the database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci-not-a-real-password \
            scampatrol_ci < db/schema.sql
          echo "Schema applied to an empty database."

      # ── Schema idempotency gate ────────────────────────────────────────────
      # Apply exactly the same file a second time, and require it to succeed.
      #
      # This is not a redundant step. Every deployment after the first one runs this
      # schema against a database that already has these tables in it. If one statement
      # is not idempotent then the FIRST deploy works, the second one fails, and it
      # fails at release time on the box holding the real data.
      #
      # That is exactly the bug it caught: three tables were declared as bare
      # CREATE TABLE while the other twenty-two used CREATE TABLE IF NOT EXISTS. On a
      # fresh database it was invisible. It would have broken the first redeploy.
      #
      # A test that only ever runs against an empty database cannot find this. The
      # second application is the whole test.
      - name: Apply the schema AGAIN — the idempotency gate
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci-not-a-real-password \
            scampatrol_ci < db/schema.sql
          echo "Schema is idempotent: re-applying it to a populated database is safe,"
          echo "so a redeploy cannot fail on the database step."

      - name: Count the tables that exist
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci-not-a-real-password \
            -N -B -e "SELECT COUNT(*) FROM information_schema.tables
                      WHERE table_schema='scampatrol_ci';" \
            | xargs -I{} echo "{} tables present after two applications."

      # With MySQL reachable, the suite's database-dependent tests actually run instead
      # of skipping. This is the step that turns the test job from a style check into a
      # real integration gate.
      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # 3. DOCKER BUILD — prove the artifact, not just the source.
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    # `needs:` means this only starts if BOTH earlier jobs passed. No point building an
    # image from code we already know is broken, and no point building one at all if it
    # would have a credential inside it.
    needs: [secret-scan, lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Buildx is Docker's newer builder. We want it for the GitHub Actions cache below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: . # build using the repo root, where the Dockerfile lives
          push: false # a pull request must never publish anything
          load: true # keep the built image on this runner so the next step can run it
          tags: scampatrol:ci
          cache-from: type=gha # reuse layers cached by previous runs
          cache-to: type=gha,mode=max

      # A built image is not a working image: a missing COPY or a bad CMD still builds
      # fine and then crashes on start. So we boot it and ask it for a real page.
      #
      # We request "/" rather than "/api/health" on purpose. There is no database in
      # this container, and /api/health deliberately pings MySQL, so it would report
      # unhealthy for a perfectly good image. The deep check belongs after deployment,
      # where a database actually exists.
      - name: Boot the image and prove it serves traffic
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e AI_FAKE=1 \
            -e JWT_SECRET=ci-smoke-test-not-real \
            scampatrol:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Container serves traffic."
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done

          echo "Container never became ready. Logs follow:"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # ── The pipeline reports on itself ─────────────────────────────────────
      # Compare what this pull request builds against what is currently published, and
      # write the difference into the run summary, where the reviewer already is.
      #
      # Image size is not vanity. It is pull time on a small EC2 box, and a jump of tens
      # of megabytes nearly always means a dependency arrived that nobody discussed.
      # Surfacing it ON the pull request is the difference between noticing now and
      # noticing in a month.
      #
      # Nothing here may fail the build. This step reports, it does not judge, and on
      # the very first run there is no published image to compare against at all.
      - name: Report image size against what is published
        if: always()
        continue-on-error: true
        run: |
          NEW=$(docker image inspect scampatrol:ci --format '{{.Size}}')
          LAYERS=$(docker image inspect scampatrol:ci --format '{{len .RootFS.Layers}}')
          human() { numfmt --to=iec --suffix=B "$1" 2>/dev/null || echo "$1 bytes"; }

          PUBLISHED=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')

          {
            echo "### Image built from this pull request"
            echo ""
            echo "| Measure | Value |"
            echo "|---|---|"
            echo "| Size | \`$(human "$NEW")\` |"
            echo "| Layers | \`$LAYERS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if docker pull -q "$PUBLISHED" > /dev/null 2>&1; then
            OLD=$(docker image inspect "$PUBLISHED" --format '{{.Size}}')
            DELTA=$((NEW - OLD))
            if [ "$DELTA" -ge 0 ]; then SIGN="+"; else SIGN="-"; fi
            echo "| Change vs published \`latest\` | \`${SIGN}$(human "${DELTA#-}")\` |" \
              >> "$GITHUB_STEP_SUMMARY"
            if [ "$DELTA" -gt 26214400 ]; then
              {
                echo ""
                echo "> This pull request adds more than 25 MB to the image. Worth checking"
                echo "> which dependency arrived before merging it."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| Change vs published \`latest\` | nothing published yet to compare against |" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 4. CI SUMMARY — one check for branch protection to require.
  #
  # Branch protection matches required checks BY NAME. Requiring each job by name works
  # right up until the day a job is added or renamed, at which point protection quietly
  # stops covering it and nobody finds out. Requiring this one job instead means the
  # ruleset never has to change again: adding a job to `needs` below is enough to make
  # that job blocking.
  #
  # `if: always()` is load-bearing. Without it this job would be SKIPPED whenever
  # something upstream failed, and a skipped required check does not fail a pull
  # request, so the gate would quietly pass broken code. It runs always, then inspects
  # the upstream results itself.
  # ──────────────────────────────────────────────────────────────────────────
  ci-summary:
    if: always()
    needs: [secret-scan, lint-and-test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed
        run: |
          echo "secret-scan   : ${{ needs.secret-scan.result }}"
          echo "lint-and-test : ${{ needs.lint-and-test.result }}"
          echo "docker-build  : ${{ needs.docker-build.result }}"

          if [ "${{ needs.secret-scan.result }}" != "success" ] \
            || [ "${{ needs.lint-and-test.result }}" != "success" ] \
            || [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo ""
            echo "A required check did not pass, so this pull request cannot be merged."
            exit 1
          fi
          echo ""
          echo "All gates passed: no secrets, style clean, config contract intact,"
          echo "schema idempotent, tests green against a real database, image boots."
