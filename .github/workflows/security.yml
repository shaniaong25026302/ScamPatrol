name: Security Scans (Warn Only)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

# These scans report security findings, but they deliberately do not act as
# the repository's merge gate. Shania's ci.yml remains the blocking pipeline.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  npm-audit:
    name: npm audit (high and critical)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan npm dependencies
        run: npm audit --audit-level=high

  trivy:
    name: Trivy container vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ScamPatrol image
        run: docker build --tag scampatrol-security:${{ github.sha }} .

      - name: Scan image and create SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scampatrol-security:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy findings to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyse source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for leaked secrets
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
