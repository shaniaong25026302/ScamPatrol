# CD — runs after a change is merged into main.
#
# It builds the image, publishes it to GHCR (GitHub's container registry), then
# PULLS IT BACK and boots it. That last step is what earns the word "verified":
# a build and a push can both succeed while the thing in the registry is not what
# we think, so the only honest check is to fetch it and run it.
#
# Where this pipeline stops: at a verified image in the registry. It never touches
# the live server. Deploying that image is a separate, separately-owned step, which
# keeps the two halves in different files with no shared ownership.
name: CD

on:
  push:
    branches: [main] # i.e. after a pull request is merged
  workflow_dispatch: # lets us re-run it by hand from the Actions tab

concurrency:
  group: cd-main
  cancel-in-progress: false # never abandon a half-finished publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the code
      packages: write # write the image to GHCR
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created automatically for this one run and expires with it.
      # There is no long-lived password to store, rotate, or leak. That is the main
      # reason we chose GHCR over Docker Hub, which needs a stored access token.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out what to name the image. Produces two tags:
      #   sha-<short commit>  the immutable one we actually deploy and roll back to
      #   latest              a convenience pointer to the newest build
      # It also lowercases the repository name, which the registry requires.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fetch back exactly what we published and prove it starts. As in CI we ask for
      # "/" and not "/api/health", because there is no database alongside this container.
      - name: Verify the published image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Verifying $IMAGE"
          docker pull "$IMAGE"

          docker run -d --name verify -p 3000:3000 \
            -e AI_FAKE=1 \
            -e JWT_SECRET=verify-only-not-a-real-secret \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "VERIFIED: $IMAGE is published and boots cleanly."
              docker rm -f verify
              exit 0
            fi
            sleep 2
          done

          echo "The published image never became ready. Logs follow:"
          docker logs verify
          docker rm -f verify
          exit 1

      # Prints the image name into the run summary, so the deploy owner can copy the
      # exact tag to release without digging through logs.
      - name: Publish summary
        if: success()
        run: |
          {
            echo "### Image published and verified"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull it with: \`docker pull $(echo "${{ steps.meta.outputs.tags }}" | head -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
