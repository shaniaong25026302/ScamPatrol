# CD — runs after a change is merged into main.
#
# It builds the image, publishes it to GHCR (GitHub's container registry), then
# PULLS IT BACK and boots it. That last step is what earns the word "verified":
# a build and a push can both succeed while the thing in the registry is not what
# we think, so the only honest check is to fetch it and run it.
#
# Where this pipeline stops: at a verified image in the registry. It never touches
# the live server. Deploying that image is a separate, separately-owned step, which
# keeps the two halves in different files with no shared ownership.
name: CD

on:
  push:
    branches: [main] # i.e. after a pull request is merged
  workflow_dispatch: # lets us run it by hand from the Actions tab
    inputs:
      verify_tag:
        description: "Existing tag to re-verify before rolling back to it, e.g. sha-abc1234. Leave blank to build main."
        required: false
        default: ""

concurrency:
  group: cd-main
  cancel-in-progress: false # never abandon a half-finished publish

jobs:
  # ── Normal release: build main, publish it, prove what we published works.
  publish:
    if: github.event_name == 'push' || inputs.verify_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the code
      packages: write # write the image to GHCR
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created automatically for this one run and expires with it.
      # There is no long-lived password to store, rotate, or leak. That is the main
      # reason we chose GHCR over Docker Hub, which needs a stored access token.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out what to name the image. Produces two tags:
      #   sha-<short commit>  the immutable one we actually deploy and roll back to
      #   latest              a convenience pointer to the newest build
      # It also lowercases the repository name, which the registry requires.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fetch back exactly what we published and prove it starts. As in CI we ask for
      # "/" and not "/api/health", because there is no database alongside this container.
      - name: Verify the published image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Verifying $IMAGE"
          docker pull "$IMAGE"

          docker run -d --name verify -p 3000:3000 \
            -e AI_FAKE=1 \
            -e JWT_SECRET=verify-only-not-a-real-secret \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "VERIFIED: $IMAGE is published and boots cleanly."
              docker rm -f verify
              exit 0
            fi
            sleep 2
          done

          echo "The published image never became ready. Logs follow:"
          docker logs verify
          docker rm -f verify
          exit 1

      # Prints the image name into the run summary, so the deploy owner can copy the
      # exact tag to release without digging through logs.
      - name: Publish summary
        if: success()
        run: |
          {
            echo "### Image published and verified"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull it with: \`docker pull $(echo "${{ steps.meta.outputs.tags }}" | head -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Rollback support: prove an OLDER published tag still boots, BEFORE anyone rolls
  # back to it. Runs only when a tag is typed into verify_tag on a manual run.
  #
  # Why this exists: "roll back and hope" is the usual approach. Re-verifying the
  # candidate first means we never roll back to an image we have not just proven good.
  # It is also the only honest way to use that input box: an input nothing reads is
  # worse than no input at all, because the run appears to do something and does not.
  verify-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # only needs to READ the registry, never write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the rollback candidate
        run: |
          # The registry rejects uppercase, and the repository name has some.
          IMAGE=$(echo "ghcr.io/${{ github.repository }}:${{ inputs.verify_tag }}" | tr '[:upper:]' '[:lower:]')
          echo "Re-verifying $IMAGE"
          docker pull "$IMAGE"

          docker run -d --name rollback-check -p 3000:3000 \
            -e AI_FAKE=1 \
            -e JWT_SECRET=verify-only-not-a-real-secret \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "SAFE TO ROLL BACK: $IMAGE boots cleanly."
              echo "### Rollback candidate verified" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$IMAGE\` boots cleanly. Safe to redeploy." >> "$GITHUB_STEP_SUMMARY"
              docker rm -f rollback-check
              exit 0
            fi
            sleep 2
          done

          echo "DO NOT ROLL BACK to this tag: it never became ready. Logs follow:"
          docker logs rollback-check
          docker rm -f rollback-check
          exit 1
