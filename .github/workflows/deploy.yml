# Deploy — release a published image onto the live EC2 host, and undo it automatically
# if the release is bad.
#
# This is the last leg of the pipeline. CI proves a change is safe to merge, CD proves
# the image is real by pulling it back and booting it, and this deploys that exact image.
# Nothing here builds anything: it can only release an artifact that CD already verified,
# which is what makes a rollback meaningful. If a deploy could also build, "roll back to
# the previous version" would mean rebuilding it and hoping.
#
# ── Two safety properties worth stating plainly ────────────────────────────────
#
# 1. It deploys a PINNED tag, never a moving one. `latest` moves, so a rollback to
#    `latest` would fetch the broken image again. Every deploy records the immutable
#    image ID it replaced and rolls back to that ID, not to a tag.
#
# 2. The health gate runs from the RUNNER, over the public internet, not on the box.
#    Asking the server whether it can reach itself proves very little. Asking from the
#    outside proves what a user would actually experience, including the security group
#    and the port mapping.
#
# ── Arming automatic deploys ───────────────────────────────────────────────────
# By default this runs by hand only. Set the repository VARIABLE `AUTO_DEPLOY` to `true`
# and every successful CD run releases itself. It ships disarmed on purpose: pointing a
# brand new automatic deploy at a box that is currently serving a working demo is how you
# lose the demo. Arm it once a manual run has proved the path end to end.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to deploy, e.g. sha-abc1234. Leave blank for latest."
        required: false
        default: ""

  # Fires after CD finishes. Whether it actually deploys is decided by the job
  # condition below, not here: a trigger cannot read repository variables.
  workflow_run:
    workflows: [CD]
    types: [completed]

# One deploy at a time, and never cancel one halfway. A cancelled deploy leaves the box
# in whatever state it had reached, which is the one outcome worse than a failed deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Run by hand, OR automatically after a SUCCESSFUL CD run once AUTO_DEPLOY is set.
    # Checking the conclusion matters: workflow_run fires when CD finishes, including
    # when it finishes by failing, and deploying an image whose verification failed
    # would defeat the point of verifying it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY == 'true')

    runs-on: ubuntu-latest

    # Naming an environment does three things: it scopes EC2_SSH_KEY so only this job can
    # read it, it records every release against the environment so there is a deployment
    # history, and it is where a required reviewer would be added if we wanted deploys to
    # need approval.
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}

    steps:
      # ── Work out what to deploy ──────────────────────────────────────────────
      # By hand: whatever was typed, or `latest` if the box was left blank.
      # Automatically: the exact commit CD just published, as sha-<short>. Deriving it
      # from the triggering run rather than from `latest` means this deploys the image
      # built from THAT commit even if another merge lands while this job is queued.
      - name: Decide which image to deploy
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
            [ -n "$TAG" ] || TAG="latest"
          else
            TAG="sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          fi
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO:$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      # ── Prepare SSH ──────────────────────────────────────────────────────────
      # The key is written with printf rather than echo, because echo mangles backslashes
      # in some shells and a subtly corrupted private key fails with an error that points
      # nowhere near the real cause. chmod 600 first: ssh refuses a key others can read.
      #
      # Note there is no `set -x` anywhere in this file, and there must never be. Trace
      # mode would echo the key into a public build log.
      - name: Set up the SSH key and known host
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

          # Pin the host's fingerprint instead of disabling host checking. This is still
          # trust-on-first-use, so it does not prove the host is genuine, but it does mean
          # a swap AFTER this point is detected rather than silently accepted, which is
          # what StrictHostKeyChecking=no would do.
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH ready for ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}"

      # ── Release ──────────────────────────────────────────────────────────────
      # `bash -s -- "$IMAGE"` feeds the script below to the remote shell over stdin and
      # passes the image name as $1. The heredoc marker is quoted ('REMOTE'), so nothing
      # inside it is expanded locally: what is written here is exactly what runs there.
      - name: Deploy the image
        id: release
        run: |
          IMAGE="${{ steps.target.outputs.image }}"

          ssh -i ~/.ssh/deploy.pem -o BatchMode=yes -o ConnectTimeout=30 \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "bash -s -- '$IMAGE'" <<'REMOTE' | tee /tmp/deploy.log
          set -euo pipefail
          NEW_IMAGE="$1"
          NAME=scampatrol

          # Record the rollback point BEFORE touching anything, and record it as an image
          # ID rather than a tag. This is the important line in the whole file: we are
          # about to `docker pull` a tag, and if the deploy used a moving tag then that
          # pull has already moved it. The ID cannot move.
          PREV_ID=$(docker inspect "$NAME" --format '{{.Image}}' 2>/dev/null || true)
          PREV_IMAGE=$(docker inspect "$NAME" --format '{{.Config.Image}}' 2>/dev/null || true)
          echo "PREVIOUS_ID=${PREV_ID:-none}"
          echo "Currently running: ${PREV_IMAGE:-nothing}"

          # Find the directory holding the real configuration. The app is configured from
          # a .env that lives only on this box, never in the repository and never in the image.
          #
          # /opt/scampatrol comes FIRST because that is where Ansible puts it, and Ansible is
          # what owns this box's configuration. The two home directories are only here for the
          # transition, from when the box was set up by hand; once Ansible has run everywhere
          # they can be deleted and this list becomes one entry.
          #
          # Picking the wrong one is not a harmless mistake. Each directory has its OWN .env,
          # so deploying from a stale one would start the app with stale configuration and the
          # health check would probably still pass.
          APP_DIR=""
          for d in /opt/scampatrol "$HOME/scampatrol" "$HOME/scamlah"; do
            if [ -f "$d/.env" ]; then APP_DIR="$d"; break; fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "No application directory with a .env was found. Nothing was changed."
            exit 1
          fi
          echo "Using configuration from $APP_DIR/.env"

          echo "Pulling $NEW_IMAGE"
          docker pull "$NEW_IMAGE"

          # Mirrors docker-compose.prod.yml exactly: same container name, same port
          # mapping, same restart policy, same env file. Driving docker directly rather
          # than compose is deliberate, because rolling back needs to start a specific
          # image ID, and a compose file names a tag.
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d --name "$NAME" \
            --restart unless-stopped \
            -p 80:3000 \
            --env-file "$APP_DIR/.env" \
            "$NEW_IMAGE"

          echo "Started $NAME from $NEW_IMAGE"
          REMOTE

          # Carry the rollback point out to the next steps.
          PREV=$(grep '^PREVIOUS_ID=' /tmp/deploy.log | tail -1 | cut -d= -f2)
          echo "previous_id=$PREV" >> "$GITHUB_OUTPUT"

      # ── The gate ─────────────────────────────────────────────────────────────
      # The DEEP health check is the right one here, and only here. It pings MySQL and
      # returns 503 when the database is unreachable. That is wrong for a container probe,
      # where a brief blip would trigger a restart loop, and exactly right for a release
      # gate, where "the app started but cannot reach its database" is a failed release.
      - name: Health gate — is it actually serving?
        id: health
        run: |
          HOST="http://${{ vars.EC2_HOST }}"
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 5 "$HOST/api/health" 2>/dev/null) && {
              echo "Healthy: $BODY"
              curl -fsS --max-time 5 -o /dev/null -w "Homepage: HTTP %{http_code}\n" "$HOST/"
              exit 0
            }
            sleep 3
          done

          echo "The deployed release never became healthy in 90 seconds."
          echo "Last response from $HOST/api/health:"
          curl -sS --max-time 5 -i "$HOST/api/health" 2>&1 | head -20 || true
          exit 1

      # ── Undo ─────────────────────────────────────────────────────────────────
      # Runs only when the health gate failed. This is the part that makes the deploy
      # safe to run: the worst case is a few seconds of downtime followed by an automatic
      # return to the version that was serving before, with no human awake and no decision
      # to make.
      - name: Roll back — the release did not come up healthy
        if: failure() && steps.release.outputs.previous_id != '' && steps.release.outputs.previous_id != 'none'
        run: |
          PREV="${{ steps.release.outputs.previous_id }}"
          echo "Rolling back to the image that was running before: $PREV"

          ssh -i ~/.ssh/deploy.pem -o BatchMode=yes -o ConnectTimeout=30 \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "bash -s -- '$PREV'" <<'REMOTE'
          set -euo pipefail
          PREV_ID="$1"
          NAME=scampatrol
          APP_DIR=""
          for d in /opt/scampatrol "$HOME/scampatrol" "$HOME/scamlah"; do
            if [ -f "$d/.env" ]; then APP_DIR="$d"; break; fi
          done
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d --name "$NAME" \
            --restart unless-stopped \
            -p 80:3000 \
            --env-file "$APP_DIR/.env" \
            "$PREV_ID"
          echo "Rolled back to $PREV_ID"
          REMOTE

          # Prove the rollback worked. An automatic rollback that is not itself verified is
          # just a second unverified deploy.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://${{ vars.EC2_HOST }}/api/health" >/dev/null 2>&1; then
              echo "Rollback verified: the previous version is serving again."
              exit 0
            fi
            sleep 3
          done
          echo "The rollback did not come up either. The site needs a human."
          exit 1

      # ── Report ───────────────────────────────────────────────────────────────
      - name: Write the release summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.target.outputs.image }}\` |"
            echo "| Host | ${{ vars.EC2_HOST }} |"
            echo "| Health gate | ${{ steps.health.outcome }} |"
            echo "| Triggered by | ${{ github.event_name }} |"
            if [ "${{ steps.health.outcome }}" != "success" ]; then
              echo ""
              echo "The health gate failed, so the previous version was restored automatically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always remove the key, including when an earlier step failed. The runner is
      # destroyed after the job either way, so this is belt and braces rather than the
      # only thing standing between the key and the world, but a private key should never
      # outlive the step that needed it.
      - name: Shred the SSH key
        if: always()
        run: shred -u ~/.ssh/deploy.pem 2>/dev/null || rm -f ~/.ssh/deploy.pem
