- name: Update apt package cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - python3-pip
    state: present

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  service:
    name: docker
    state: started
    enabled: true

- name: Add app user to docker group
  user:
    name: "{{ app_user }}"
    groups: docker
    append: true

- name: Create swap file
  command: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
  args:
    creates: "{{ swap_file }}"

- name: Set swap file permissions
  file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Check whether swap file is already active
  command: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false

- name: Format swap file
  command: "mkswap {{ swap_file }}"
  when: swap_file not in active_swap.stdout

- name: Enable swap
  command: "swapon {{ swap_file }}"
  when: swap_file not in active_swap.stdout

- name: Make swap permanent in fstab
  mount:
    name: none
    src: "{{ swap_file }}"
    fstype: swap
    opts: sw
    passno: "0"
    dump: "0"
    state: present

- name: Create ScamPatrol app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Create persistent uploads directory
  file:
    path: "{{ upload_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Create persistent app data directory
  file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Generate .env file from template
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"